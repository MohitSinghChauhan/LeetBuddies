<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetBuddies</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../dist/css/iziToast.min.css">
    <script src="../dist/js/iziToast.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body class="dark-theme">
    <main class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <img src="../assets/icons/icon48.png" alt="Logo" class="app-logo">
                <h1>LeetBuddies</h1>
            </div>
            <div class="header-actions">
                <button id="toggleTheme" class="icon-btn" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
                <button id="refreshBtn" class="icon-btn" title="Refresh All"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
        </header>

        <!-- Search Bar -->
        <section class="search-section">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="usernameInput" placeholder="Add a LeetCode username..." autocomplete="off">
                <button id="addBtn" class="primary-btn">Add</button>
            </div>
        </section>

        <!-- Tools & Filters -->
        <section class="tools-section">
            <div class="tool-group">
                <label for="themeSelect"><i class="fa-solid fa-palette"></i> Stats Theme:</label>
                <select id="themeSelect">
                    <option value="dark" selected>Dark</option>
                    <option value="forest">Forest</option>
                    <option value="light">Light</option>
                    <option value="nord">Nord</option>
                    <option value="unicorn">Unicorn</option>
                    <option value="wtf">WTF</option>
                </select>
            </div>
            <div class="tool-group">
                <label for="extSelect"><i class="fa-solid fa-puzzle-piece"></i> Details:</label>
                <select id="extSelect">
                    <option value="">None</option>
                    <option value="activity" selected>Activity</option>
                    <option value="contest">Contest</option>
                    <option value="heatmap">Heatmap</option>
                </select>
            </div>
            <div class="tool-group">
                <label for="sortSelect"><i class="fa-solid fa-arrow-down-9-1"></i> Sort:</label>
                <select id="sortSelect">
                    <option value="total">Total</option>
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
        </section>

        <!-- Friends List -->
        <section class="friends-list-container">
            <div id="friendsList" class="friends-list">
                <!-- User Cards will be injected here -->
            </div>
            <div id="emptyState" class="empty-state hidden">
                <i class="fa-solid fa-user-astronaut"></i>
                <p>No buddies tracked yet.<br>Add someone to start competing!</p>
            </div>
        </section>

        <!-- Footer -->
        <footer class="app-footer">
            <p>Made with <i class="fa-solid fa-heart" style="color: #ff375f; font-size: 0.65rem;"></i> by Mohit</p>
            <a href="https://github.com/MohitSinghChauhan/LeetBuddies" target="_blank" class="github-star-btn">
                <i class="fa-brands fa-github"></i> Star it on GitHub
            </a>
        </footer>
    </main>

    <!-- Templates -->
    <template id="userCardTemplate">
        <div class="user-card flex-col">
            <div class="card-header">
                <a href="#" class="username" target="_blank">Username</a>
                <div style="display: flex; gap: 4px; align-items: center;">
                    <button class="toggle-stats-btn" title="Show Rich Stats"><i class="fa-solid fa-chart-area"></i> <span>Rich Stats</span></button>
                    <button class="delete-btn" title="Remove User"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            </div>
            <div class="stats-row">
                <div class="stat badge-easy" title="Easy Solved">
                    <span class="label">Easy</span>
                    <span class="value easy-val">0</span>
                </div>
                <div class="stat badge-medium" title="Medium Solved">
                    <span class="label">Med</span>
                    <span class="value medium-val">0</span>
                </div>
                <div class="stat badge-hard" title="Hard Solved">
                    <span class="label">Hard</span>
                    <span class="value hard-val">0</span>
                </div>
                <div class="stat badge-total" title="Total Solved">
                    <span class="label">Total</span>
                    <span class="value total-val">0</span>
                </div>
            </div>
            
            <!-- Accordion Preview -->
            <div class="accordion-wrapper">
                <div class="accordion-preview">
                    <img class="leetcard-img" src="" alt="LeetCard Stats" loading="lazy">
                </div>
            </div>

            <!-- Loading Overlay -->
            <div class="card-loader hidden">
                <div class="spinner"></div>
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
